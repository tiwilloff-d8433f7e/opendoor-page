<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>开门</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e1012;color:#e8eaed;font-family:-apple-system,"PingFang SC",sans-serif;min-height:100vh}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px}
#btn-open{width:210px;height:210px;border-radius:50%;border:1px solid #2c3136;background:#17191c;color:#fff;font-size:27px;font-weight:600;letter-spacing:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#btn-open:active{background:#1f2327}
#btn-open[disabled]{opacity:.55}
#in-key{width:230px;padding:13px;border:1px solid #2a2e33;border-radius:10px;background:#141619;color:#e8eaed;font-size:16px;text-align:center}
#btn-activate{margin-top:16px;width:230px;padding:13px;border:0;border-radius:10px;background:#e8eaed;color:#111;font-size:15px;font-weight:600}
.panel{width:100%;max-width:520px;margin:0 auto;padding:24px 20px 40px}
.panel p{font-size:13px;color:#9aa3ab;line-height:1.6;margin:14px 0 6px}
textarea{width:100%;height:110px;background:#141619;border:1px solid #2a2e33;border-radius:10px;color:#e8eaed;padding:10px;font-size:12px}
#btn-save{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#e8eaed;color:#111;font-size:15px;font-weight:600}
#btn-clear{background:none;border:0;color:#7d858d;font-size:13px;margin-top:14px;padding:6px}
.hidden{display:none}
</style>
</head>
<body>
<div id="view-key" class="center hidden">
<input id="in-key" type="text" placeholder="输入卡密" autocomplete="off">
<button id="btn-activate">激活</button>
</div>
<div id="view-main" class="center hidden">
<button id="btn-open">开门</button>
</div>
<div id="view-config" class="hidden">
<div class="panel">
<p>登录响应（Stream 里 login/sms 的响应）</p>
<textarea id="ta-login" placeholder="粘贴 JSON"></textarea>
<p>开门请求体（Stream 里开门请求的查看 JSON）</p>
<textarea id="ta-open" placeholder="粘贴 JSON"></textarea>
<button id="btn-save">保存</button>
<button id="btn-clear">清除配置</button>
</div>
</div>
<script>
function md5(input) {
  function safeAdd(x, y) {
    const lsw = (x & 0xffff) + (y & 0xffff)
    const msw = (x >>> 16) + (y >>> 16) + (lsw >>> 16)
    return (msw << 16) | (lsw & 0xffff)
  }
  function rol(num, cnt) { return (num << cnt) | (num >>> (32 - cnt)) }
  function cmn(q, a, b, x, s, t) {
    return safeAdd(rol(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b)
  }
  function ff(a,b,c,d,x,s,t) { return cmn((b & c) | ((~b) & d),a,b,x,s,t) }
  function gg(a,b,c,d,x,s,t) { return cmn((b & d) | (c & (~d)),a,b,x,s,t) }
  function hh(a,b,c,d,x,s,t) { return cmn(b ^ c ^ d,a,b,x,s,t) }
  function ii(a,b,c,d,x,s,t) { return cmn(c ^ (b | (~d)),a,b,x,s,t) }
  function utf8(s) { return unescape(encodeURIComponent(s)) }
  function hex(n) {
    let out = ""
    for (let j = 0; j < 4; j++) out += ((n >>> (j * 8)) & 0xff).toString(16).padStart(2, "0")
    return out
  }

  const str = utf8(input)
  const x = []
  for (let i = 0; i < str.length; i++) x[i >> 2] = (x[i >> 2] || 0) | (str.charCodeAt(i) << ((i % 4) * 8))
  x[str.length >> 2] = (x[str.length >> 2] || 0) | (0x80 << ((str.length % 4) * 8))
  x[(((str.length + 8) >>> 6) << 4) + 14] = str.length * 8

  let a = 0x67452301, b = 0xefcdab89, c = 0x98badcfe, d = 0x10325476
  for (let k = 0; k < x.length; k += 16) {
    const oa = a, ob = b, oc = c, od = d
    a=ff(a,b,c,d,x[k+0]||0,7,-680876936); d=ff(d,a,b,c,x[k+1]||0,12,-389564586); c=ff(c,d,a,b,x[k+2]||0,17,606105819); b=ff(b,c,d,a,x[k+3]||0,22,-1044525330)
    a=ff(a,b,c,d,x[k+4]||0,7,-176418897); d=ff(d,a,b,c,x[k+5]||0,12,1200080426); c=ff(c,d,a,b,x[k+6]||0,17,-1473231341); b=ff(b,c,d,a,x[k+7]||0,22,-45705983)
    a=ff(a,b,c,d,x[k+8]||0,7,1770035416); d=ff(d,a,b,c,x[k+9]||0,12,-1958414417); c=ff(c,d,a,b,x[k+10]||0,17,-42063); b=ff(b,c,d,a,x[k+11]||0,22,-1990404162)
    a=ff(a,b,c,d,x[k+12]||0,7,1804603682); d=ff(d,a,b,c,x[k+13]||0,12,-40341101); c=ff(c,d,a,b,x[k+14]||0,17,-1502002290); b=ff(b,c,d,a,x[k+15]||0,22,1236535329)
    a=gg(a,b,c,d,x[k+1]||0,5,-165796510); d=gg(d,a,b,c,x[k+6]||0,9,-1069501632); c=gg(c,d,a,b,x[k+11]||0,14,643717713); b=gg(b,c,d,a,x[k+0]||0,20,-373897302)
    a=gg(a,b,c,d,x[k+5]||0,5,-701558691); d=gg(d,a,b,c,x[k+10]||0,9,38016083); c=gg(c,d,a,b,x[k+15]||0,14,-660478335); b=gg(b,c,d,a,x[k+4]||0,20,-405537848)
    a=gg(a,b,c,d,x[k+9]||0,5,568446438); d=gg(d,a,b,c,x[k+14]||0,9,-1019803690); c=gg(c,d,a,b,x[k+3]||0,14,-187363961); b=gg(b,c,d,a,x[k+8]||0,20,1163531501)
    a=gg(a,b,c,d,x[k+13]||0,5,-1444681467); d=gg(d,a,b,c,x[k+2]||0,9,-51403784); c=gg(c,d,a,b,x[k+7]||0,14,1735328473); b=gg(b,c,d,a,x[k+12]||0,20,-1926607734)
    a=hh(a,b,c,d,x[k+5]||0,4,-378558); d=hh(d,a,b,c,x[k+8]||0,11,-2022574463); c=hh(c,d,a,b,x[k+11]||0,16,1839030562); b=hh(b,c,d,a,x[k+14]||0,23,-35309556)
    a=hh(a,b,c,d,x[k+1]||0,4,-1530992060); d=hh(d,a,b,c,x[k+4]||0,11,1272893353); c=hh(c,d,a,b,x[k+7]||0,16,-155497632); b=hh(b,c,d,a,x[k+10]||0,23,-1094730640)
    a=hh(a,b,c,d,x[k+13]||0,4,681279174); d=hh(d,a,b,c,x[k+0]||0,11,-358537222); c=hh(c,d,a,b,x[k+3]||0,16,-722521979); b=hh(b,c,d,a,x[k+6]||0,23,76029189)
    a=hh(a,b,c,d,x[k+9]||0,4,-640364487); d=hh(d,a,b,c,x[k+12]||0,11,-421815835); c=hh(c,d,a,b,x[k+15]||0,16,530742520); b=hh(b,c,d,a,x[k+2]||0,23,-995338651)
    a=ii(a,b,c,d,x[k+0]||0,6,-198630844); d=ii(d,a,b,c,x[k+7]||0,10,1126891415); c=ii(c,d,a,b,x[k+14]||0,15,-1416354905); b=ii(b,c,d,a,x[k+5]||0,21,-57434055)
    a=ii(a,b,c,d,x[k+12]||0,6,1700485571); d=ii(d,a,b,c,x[k+3]||0,10,-1894986606); c=ii(c,d,a,b,x[k+10]||0,15,-1051523); b=ii(b,c,d,a,x[k+1]||0,21,-2054922799)
    a=ii(a,b,c,d,x[k+8]||0,6,1873313359); d=ii(d,a,b,c,x[k+15]||0,10,-30611744); c=ii(c,d,a,b,x[k+6]||0,15,-1560198380); b=ii(b,c,d,a,x[k+13]||0,21,1309151649)
    a=ii(a,b,c,d,x[k+4]||0,6,-145523070); d=ii(d,a,b,c,x[k+11]||0,10,-1120210379); c=ii(c,d,a,b,x[k+2]||0,15,718787259); b=ii(b,c,d,a,x[k+9]||0,21,-343485551)
    a=safeAdd(a,oa); b=safeAdd(b,ob); c=safeAdd(c,oc); d=safeAdd(d,od)
  }
  return hex(a)+hex(b)+hex(c)+hex(d)
}
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)) }
  var maxWord = Math.pow(2, 32), result = "";
  var words = [], asciiBitLength = ascii.length * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [];
  var primeCounter = k.length, isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += "\x80";
  while ((ascii.length % 64) - 56) ascii += "\x00";
  for (var i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    if (j >> 8) return sha256(unescape(encodeURIComponent(ascii)));
    words[i >> 2] |= j << (((3 - i) % 4) * 8);
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = asciiBitLength;
  for (var j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (var i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (var i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (var i = 0; i < 8; i++) {
    for (var j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? "0" : "") + b.toString(16);
    }
  }
  return result;
}

var KEY_HASH = "54a61b904dcaa55683785c488bd372b0d0ced7ddb501202aba55b1cce5a121e0";
var PATHS = ["/api/v1/opendoor/openDoorControlV2", "/lzmh_app_api/api/v1/opendoor/openDoorControlV2"];
var KEY = "opendoor.cfg.v1";
var AKEY = "opendoor.activated.v1";
function $(id){ return document.getElementById(id) }
function deepFind(obj, name){
  if(!obj || typeof obj !== "object") return undefined;
  if(Object.prototype.hasOwnProperty.call(obj, name) && typeof obj[name] === "string" && obj[name]) return obj[name];
  var ks = Object.keys(obj);
  for(var i = 0; i < ks.length; i++){ var v = deepFind(obj[ks[i]], name); if(v !== undefined) return v }
  return undefined;
}
function loadCfg(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null }catch(e){ return null } }
function isActivated(){ try{ return localStorage.getItem(AKEY) === KEY_HASH }catch(e){ return false } }
function show(view){
  $("view-key").classList.toggle("hidden", view !== "key");
  $("view-main").classList.toggle("hidden", view !== "main");
  $("view-config").classList.toggle("hidden", view !== "config");
}
function home(){ if(!isActivated()){ show("key") } else if(!loadCfg()){ show("config") } else { show("main") } }
function activate(){
  var v = $("in-key").value.trim();
  if(!v) return;
  if(sha256("opendoor-v1:" + v) === KEY_HASH){
    localStorage.setItem(AKEY, KEY_HASH);
    $("in-key").value = "";
    home();
  } else {
    alert("卡密不正确");
  }
}
function saveCfg(){
  var loginText = $("ta-login").value.trim(), openText = $("ta-open").value.trim();
  if(!loginText || !openText){ alert("两段都要粘贴"); return }
  var login, openBody;
  try{ login = JSON.parse(loginText) }catch(e){ alert("登录响应不是有效的 JSON"); return }
  try{ openBody = JSON.parse(openText) }catch(e){ alert("开门请求体不是有效的 JSON"); return }
  var token = deepFind(login, "token"), openid = deepFind(login, "openid");
  var ser = (openBody.body && openBody.body.ser_num) || deepFind(openBody, "ser_num");
  var header = openBody.header || null;
  if(!token || !openid){ alert("登录响应里没找到 token / openid"); return }
  if(!ser || !header){ alert("开门请求体里没找到 ser_num / header"); return }
  localStorage.setItem(KEY, JSON.stringify({ token: token, openid: openid, ser_num: ser, header: header }));
  $("ta-login").value = ""; $("ta-open").value = "";
  show("main");
}
function openDoor(){
  var cfg = loadCfg();
  if(!cfg){ show("config"); return }
  var btn = $("btn-open");
  btn.disabled = true;
  btn.textContent = "发送中";
  var ts = Math.floor(Date.now() / 1000).toString();
  var url = "https://lzmh.lz-qs.com:6025/lzmh_app_api/api/v1/opendoor/openDoorControlV2";
  var bodyText = JSON.stringify({ header: cfg.header, body: { ser_num: cfg.ser_num, msg_id: ts } });
  var sent = 0, failed = 0;
  function finish(){
    if(sent + failed < PATHS.length) return;
    btn.textContent = sent > 0 ? "已发送" : "发送失败";
    setTimeout(function(){ btn.disabled = false; btn.textContent = "开门" }, 1800);
  }
  PATHS.forEach(function(p, i){
    setTimeout(function(){
      var sign = md5(p + ts + cfg.token);
      var full = url + "?timestamp=" + ts + "&openid=" + encodeURIComponent(cfg.openid) + "&sign=" + sign;
      fetch(full, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: bodyText })
        .then(function(){ sent++; finish() })
        .catch(function(){ failed++; finish() });
    }, i * 500);
  });
}
var pressTimer = null, longPressed = false;
var btnOpen = $("btn-open");
btnOpen.addEventListener("touchstart", function(){
  longPressed = false;
  pressTimer = setTimeout(function(){ longPressed = true; show("config") }, 650);
}, { passive: true });
btnOpen.addEventListener("touchend", function(){ if(pressTimer) clearTimeout(pressTimer) });
btnOpen.addEventListener("click", function(){ if(!longPressed) openDoor() });
$("btn-activate").addEventListener("click", activate);
$("btn-save").addEventListener("click", saveCfg);
$("btn-clear").addEventListener("click", function(){
  if(confirm("清除本机保存的配置？")){ localStorage.removeItem(KEY); show("config") }
});
home();
</script>
</body>
</html>
